version: '3.8'

services:
  # 1. MySQL 8 Database Container
  mysql-db:
    image: mysql:8.0
    container_name: bareilly_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bareilly_bank
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. BAREILLY CITY BANK Web Application Container
  bank-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bareilly_bank_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/bareilly_bank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - bank-network

networks:
  bank-network:
    driver: bridge

volumes:
  mysql_data:
